name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package supports Node 20 and newer (package.json "engines").
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        working-directory: packages/cli
        run: npm test
      - name: check on example/
        working-directory: example
        # The example keeps a status file for main only, so name the branch: a feature
        # branch or a pull request checks the same thing as main. Exits 1 on any error.
        run: node ../packages/cli/bin/usecontextual.js check --branch main

  repo:
    name: Secrets check and site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # This repo is public. Database URLs live only in environment variables.
      - name: No connection strings or .env files committed
        run: node .github/scripts/no-connection-strings.mjs
      # The feedback form's server side: validation, Send, the limits. Node runs the TypeScript directly.
      - name: Site tests
        working-directory: site
        run: node --test lib/feedback/*.test.ts
